services:
  api:
    build: .
    container_name: ai-knowledge-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_knowledge
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:16-alpine
    container_name: ai-knowledge-postgres
    environment:
      POSTGRES_DB: ai_knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
